name: assemble-gallery-png
on:
  push:
    paths:
      - 'docs/looks-gallery.svg'
      - '.github/workflows/assemble-gallery-png.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract PNG from SVG data URL
        run: |
          python3 - <<'PY'
          import re, base64, hashlib, pathlib
          svg = pathlib.Path('docs/looks-gallery.svg').read_text()
          m = re.search(r'data:image/png;base64,([^"]+)', svg)
          assert m, 'no png data url'
          data = base64.b64decode(m.group(1))
          assert len(data) == 28896
          assert hashlib.sha256(data).hexdigest() == 'df6700417b60745c79808168c131874192bd25ede3182ea000f9372499e24edd'
          assert data[:8] == bytes([137, 80, 78, 71, 13, 10, 26, 10])
          pathlib.Path('docs/looks-gallery.png').write_bytes(data)
          print('ok', len(data))
          PY
      - name: Commit assembled PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/looks-gallery.png
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Add BOTTT looks gallery collage PNG."
          git push
